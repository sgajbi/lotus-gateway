services:
  zookeeper:
    profiles: ["full-stack"]
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,stat,mntr,conf"
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,stat,mntr,conf"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

  kafka:
    profiles: ["full-stack"]
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9093 --list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  kafka-topic-creator:
    profiles: ["full-stack"]
    build:
      context: ${LOTUS_CORE_REPO_PATH}
      dockerfile: ./src/services/persistence_service/Dockerfile
      args: *core-build-args
      labels: *core-provenance-labels
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python", "-m", "tools.kafka_setup"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
    restart: "no"

  lotus-manage-postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: dpm_supportability
      POSTGRES_USER: dpm
      POSTGRES_PASSWORD: dpm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpm -d dpm_supportability"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  lotus-manage:
    build:
      context: ${LOTUS_MANAGE_REPO_PATH}
      dockerfile: Dockerfile
      args: *manage-build-args
      labels: *manage-provenance-labels
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      APP_PERSISTENCE_PROFILE: PRODUCTION
      DPM_SUPPORTABILITY_STORE_BACKEND: POSTGRES
      DPM_SUPPORTABILITY_POSTGRES_DSN: postgresql://dpm:dpm@lotus-manage-postgres:5432/dpm_supportability
      PROPOSAL_STORE_BACKEND: POSTGRES
      PROPOSAL_POSTGRES_DSN: postgresql://dpm:dpm@lotus-manage-postgres:5432/dpm_supportability
      DPM_POLICY_PACK_CATALOG_BACKEND: POSTGRES
      DPM_POLICY_PACK_POSTGRES_DSN: postgresql://dpm:dpm@lotus-manage-postgres:5432/dpm_supportability
    depends_on:
      lotus-manage-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/integration/capabilities?consumer_system=lotus-gateway&tenant_id=default', timeout=5)"
        ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 20s

  lotus-core-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d portfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  lotus-core-migration-runner:
    build:
      context: ${LOTUS_CORE_REPO_PATH}
      dockerfile: ./src/services/persistence_service/Dockerfile
      args: *core-build-args
      labels: *core-provenance-labels
    environment:
      DATABASE_URL: postgresql://user:password@lotus-core-postgres:5432/portfolio_db
    depends_on:
      lotus-core-postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  lotus-core-query:
    build:
      context: ${LOTUS_CORE_REPO_PATH}
      dockerfile: ./src/services/query_service/Dockerfile
      args: *core-build-args
      labels: *core-provenance-labels
    ports:
      - "8201:8001"
    environment:
      DATABASE_URL: postgresql://user:password@lotus-core-postgres:5432/portfolio_db
    depends_on:
      lotus-core-migration-runner:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/integration/capabilities?consumer_system=lotus-gateway&tenant_id=default', timeout=5)"
        ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 20s

  lotus-core-ingestion:
    profiles: ["full-stack"]
    build:
      context: ${LOTUS_CORE_REPO_PATH}
      dockerfile: ./src/services/ingestion_service/Dockerfile
      args: *core-build-args
      labels: *core-provenance-labels
    ports:
      - "8200:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topic-creator:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
        ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 20s

  lotus-performance:
    image: python:3.12-slim
    working_dir: /app
    ports:
      - "8002:8000"
    volumes:
      - ${LOTUS_PERFORMANCE_REPO_PATH}:/app
    command:
      [
        "sh",
        "-lc",
        "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/integration/capabilities?consumer_system=lotus-gateway&tenant_id=default', timeout=5)"
        ]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 30s

  lotus-report:
    build:
      context: ${LOTUS_REPORT_REPO_PATH}
      dockerfile: Dockerfile
      labels: *report-provenance-labels
    ports:
      - "8300:8300"
    environment:
      LOTUS_CORE_BASE_URL: http://lotus-core-query:8001
      PA_BASE_URL: http://lotus-performance:8000
      UPSTREAM_TIMEOUT_SECONDS: 10
      CONTRACT_VERSION: v1
    depends_on:
      lotus-core-query:
        condition: service_healthy
      lotus-performance:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/integration/capabilities?consumer_system=lotus-gateway&tenant_id=default', timeout=5)"
        ]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 30s

  lotus-archive:
    build:
      context: ${LOTUS_ARCHIVE_REPO_PATH}
      dockerfile: Dockerfile
      args: *archive-build-args
      labels: *archive-provenance-labels
    ports:
      - "8150:8150"
    environment:
      CONTRACT_VERSION: v1
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8150/health/ready', timeout=5)"
        ]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 30s

  bff:
    build:
      context: .
      dockerfile: Dockerfile
      args: *gateway-build-args
      labels: *gateway-provenance-labels
    environment:
      DECISIONING_SERVICE_BASE_URL: http://lotus-manage:8000
      PORTFOLIO_DATA_PLATFORM_BASE_URL: http://lotus-core-query:8001
      PORTFOLIO_DATA_INGESTION_BASE_URL: ${PORTFOLIO_DATA_INGESTION_BASE_URL:-http://lotus-core-ingestion:8000}
      PERFORMANCE_ANALYTICS_BASE_URL: http://lotus-performance:8000
      REPORTING_AGGREGATION_BASE_URL: http://lotus-report:8300
      ARCHIVE_SERVICE_BASE_URL: http://lotus-archive:8150
      UPSTREAM_TIMEOUT_SECONDS: 10
      CONTRACT_VERSION: v1
      LOTUS_IMAGE_DIGEST: ${GATEWAY_IMAGE_DIGEST:-not-supplied}
    ports:
      - "8100:8100"
    depends_on:
      lotus-manage:
        condition: service_healthy
      lotus-core-query:
        condition: service_healthy
      lotus-performance:
        condition: service_healthy
      lotus-report:
        condition: service_healthy
      lotus-archive:
        condition: service_healthy
      lotus-core-ingestion:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"
        ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 15s

  ui:
    profiles: ["full-stack"]
    build:
      context: ${UI_REPO_PATH}
      dockerfile: Dockerfile
      labels: *workbench-provenance-labels
    environment:
      BFF_BASE_URL: http://bff:8100
    ports:
      - "3000:3000"
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1:3000"
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
