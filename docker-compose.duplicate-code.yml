services:
  duplicate-code-protected:
    platform: linux/amd64
    image: node:20-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
    working_dir: /source
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    volumes:
      - ./:/source:ro
      - duplicate-code-protected-quality-dependencies:/dependencies/quality
      - duplicate-code-protected-output:/output
    command:
      - sh
      - -lc
      - |
        set -eu
        node --version
        python3 --version
        ln -sf /usr/bin/python3 /tmp/python
        mkdir -p /dependencies/quality
        cp /source/quality/package.json /source/quality/package-lock.json /dependencies/quality/
        PATH="/tmp:$$PATH" make duplicate-code DUPLICATE_CODE_QUALITY_DIR=/dependencies/quality DUPLICATE_CODE_OUTPUT_DIR=/output/duplicate-code

volumes:
  duplicate-code-protected-quality-dependencies:
  duplicate-code-protected-output:
