[project]
name = "lotus-gateway"
version = "0.1.0"
description = "lotus-gateway for Advisor Workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.129.0,<0.136.3",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.9",
  "prometheus-fastapi-instrumentator>=7.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.2.1",
  "httpx2>=2.12.0,<3.0.0",
  "ruff>=0.15.15,<0.16",
  "mypy>=1.13.0",
  "pip-audit>=2.9.0"
]
quality = [
  "bandit[toml]>=1.7.10",
  "deptry>=0.23.0",
  "import-linter>=2.1",
  "interrogate>=1.7.0",
  "pip-audit>=2.9.0",
  "radon>=6.0.1",
  "vulture>=2.14",
  "xenon>=0.9.3"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/app"]

[tool.coverage.report]
fail_under = 84
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv-codex", ".venv", "output"]
skips = []

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-module = true
ignore-nested-functions = true
ignore-private = true
ignore-property-decorators = true
fail-under = 45
exclude = ["tests", "output", ".venv", ".venv-codex"]

[tool.deptry]
known_first_party = ["app"]
exclude = [".venv", ".venv-codex", "output"]

