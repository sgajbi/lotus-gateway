repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # mypy runs from the PROJECT environment, not an isolated hook environment.
  # A mirrors-mypy hook resolves its own env with no project dependencies, so it
  # cannot see fastapi or pydantic and reports import errors on every commit that
  # CI does not. Matching its rev to the pinned version does not fix that: the
  # version was never the problem, the missing dependency graph was.
  #
  # `language: system` uses the interpreter the developer installed the project
  # into, so the hook runs exactly the pinned mypy against exactly the resolved
  # dependencies -- version agreement by construction rather than by comparison.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project environment)
        entry: python -m mypy
        args: ["src"]
        language: system
        pass_filenames: false
        types: [python]
