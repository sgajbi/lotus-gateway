x-gateway-build-args: &gateway-build-args
  LOTUS_APP_VERSION: ${GATEWAY_APP_VERSION:-0.1.0}
  LOTUS_GIT_COMMIT_SHA: ${GATEWAY_GIT_COMMIT_SHA:-unknown}
  LOTUS_GIT_BRANCH: ${GATEWAY_GIT_BRANCH:-unknown}
  LOTUS_BUILD_TIMESTAMP: ${GATEWAY_BUILD_TIMESTAMP:-unknown}
  LOTUS_REPO_URL: ${GATEWAY_REPO_URL:-https://github.com/sgajbi/lotus-gateway}
  LOTUS_CI_RUN_ID: ${GATEWAY_CI_RUN_ID:-local}

x-gateway-provenance-labels: &gateway-provenance-labels
  org.opencontainers.image.revision: ${GATEWAY_GIT_COMMIT_SHA:-unknown}
  org.opencontainers.image.ref.name: ${GATEWAY_GIT_BRANCH:-unknown}
  org.opencontainers.image.created: ${GATEWAY_BUILD_TIMESTAMP:-unknown}
  org.opencontainers.image.source: ${GATEWAY_REPO_URL:-https://github.com/sgajbi/lotus-gateway}
  com.lotus.ci.run-id: ${GATEWAY_CI_RUN_ID:-local}

services:
  ci-local:
    build:
      context: .
      dockerfile: Dockerfile
      args: *gateway-build-args
      labels: *gateway-provenance-labels
    image: lotus-gateway:ci-local
    working_dir: /app
    volumes:
      - ./:/app
    # git is installed here rather than in the Dockerfile on purpose. The image
    # this compose file builds IS the production image -- `docker build` in
    # main-releasability.yml and pr-merge-gate.yml runs with no `--target`, so a
    # new stage would silently change the released artifact and a package added
    # to the base would ship to production. The source-byte gate needs the git
    # BINARY to read its inventory; the repository itself, `.git` included, is
    # already here through the bind mount above. Keeping the install in this lane
    # keeps the released image unchanged.
    command:
      [
        "sh",
        "-lc",
        "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends git && rm -rf /var/lib/apt/lists/* && git config --global --add safe.directory /app && { [ -d /app/.git ] || { echo 'ci-local must run from the primary checkout: /app/.git is a file, so this is a linked worktree whose real Git directory lives outside the bind mount and cannot be resolved in the container.' >&2; exit 1; }; } && pip install --no-cache-dir -e '.[dev]' && ruff check . && ruff format --check . && mypy src && python -m pytest tests/unit tests/contract && python -m pytest tests/integration"
      ]
    environment:
      - DECISIONING_SERVICE_BASE_URL=http://host.docker.internal:8000
      - MANAGEMENT_SERVICE_BASE_URL=http://host.docker.internal:8140
      - ARCHIVE_SERVICE_BASE_URL=http://host.docker.internal:8150
      - ARCHIVE_ACCESS_PREFLIGHT_TIMEOUT_SECONDS=3
      - MANAGE_SPLIT_ENABLED=true
      - UPSTREAM_TIMEOUT_SECONDS=30
      - CONTRACT_VERSION=v1
      - LOTUS_IMAGE_DIGEST=${GATEWAY_IMAGE_DIGEST:-not-supplied}
