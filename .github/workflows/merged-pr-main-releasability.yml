name: Merged PR Main Releasability Dispatch

on:
  pull_request_target:
    types: [closed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: write
  contents: write

jobs:
  dispatch-main-releasability:
    name: Dispatch Main Releasability
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Every revision the PR added must be enumerable, not just the head.
          fetch-depth: 0
      - name: Dispatch main releasability gate for every merged revision
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "$MERGE_COMMIT_SHA" ]; then
            echo "::error::pull_request.merge_commit_sha is required for exact-main releasability dispatch"
            exit 1
          fi

          git fetch origin main --quiet
          # Judge ancestry against the freshly fetched main, not the event-time
          # checkout snapshot.
          git checkout --quiet --detach FETCH_HEAD
          # This enumeration is correct ONLY under rebase-only merging: a squash
          # lands one commit however many the PR held (N-1 dispatches would name
          # commits from earlier PRs), and a merge commit adds a second parent
          # (the walk would descend into main's own history).
          #
          # Measure that invariant on the commits themselves rather than reading
          # the repository's declared merge settings. The settings read needs a
          # permission the workflow token may not hold — it returned null fields
          # in lotus-ai and refused outright in three dispatcher runs across two
          # repositories — and a declared posture is weaker evidence than the
          # history it is supposed to predict. Local git needs no token at all.
          merge_parents="$(git rev-list --parents -n 1 "$MERGE_COMMIT_SHA" | wc -w)"
          if [ "$merge_parents" -ne 2 ]; then
            echo "::error::$MERGE_COMMIT_SHA has $((merge_parents - 1)) parent(s); per-commit enumeration assumes rebase-only merging (exactly one). Audit that merge before trusting gate coverage."
            exit 1
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "::error::pull_request.base.sha is required to prove the enumerated window belongs to this PR"
            exit 1
          fi

          # Enumerate the exact window this PR added, rather than counting back
          # COMMIT_COUNT commits from the tip.
          #
          # pull_request.commits describes the branch when the event fired, not
          # what landed. Updating a branch from main, or a rebase that drops a
          # commit already on main, leaves that count larger than the window.
          # Walking back by it then runs off the end of the PR's own history
          # into commits earlier merges put there. Not hypothetical: on PR #744
          # the count was 3, exactly 2 revisions landed, and the walk reached
          # base.sha itself. A commit is its own ancestor, so the guard below
          # refused the entire dispatch and NOTHING was gated. The guard was
          # right; its input was wrong.
          #
          # base..tip is the window by definition: it excludes the base, follows
          # rebases, and cannot overshoot however stale the count is.
          revisions="$(git rev-list --reverse "$BASE_SHA..$MERGE_COMMIT_SHA")"
          enumerated_count="$(printf '%s\n' "$revisions" | grep -c .)"
          # The two directions of a count mismatch mean opposite things, so they
          # are not treated alike.
          #
          # FEWER than the count is expected and safe: a rebase that dropped a
          # commit already on main, a branch update, or a squash. Every revision
          # in the range still landed and still gets a verdict, so coverage is
          # complete and the count is simply stale.
          #
          # MORE than the count means the range is claiming revisions this PR did
          # not add. base.sha is the base branch as of the PR's last
          # synchronisation, not as of the merge, so when main advances
          # underneath an un-synchronised PR the range spans the other merges
          # too. Dispatching those would stamp this PR's number onto another
          # PR's revisions and report coverage that was never established here.
          # Refuse: over-claiming is the failure this whole enumeration exists to
          # prevent.
          if [ "$enumerated_count" -gt "$COMMIT_COUNT" ]; then
            echo "::error::Enumerated $enumerated_count revision(s) for PR #$PR_NUMBER but pull_request.commits reported only $COMMIT_COUNT. The $BASE_SHA..$MERGE_COMMIT_SHA range spans revisions this PR did not add, which happens when main advanced past a base that was never re-synchronised. Refusing to dispatch rather than claim another PR's revisions."
            exit 1
          fi
          if [ "$enumerated_count" -lt "$COMMIT_COUNT" ]; then
            echo "::notice::Enumerated $enumerated_count revision(s) for PR #$PR_NUMBER; pull_request.commits reported $COMMIT_COUNT. Expected after a rebase, branch update or squash: the range is authoritative and every revision in it is gated."
          fi
          if [ -z "$revisions" ]; then
            echo "::error::No revisions enumerated for merged PR #$PR_NUMBER at $MERGE_COMMIT_SHA"
            exit 1
          fi

          # Every enumerated revision must be one of THIS PR's commits.
          #
          # The count comparison above cannot establish that, in either
          # direction. Two effects cancel exactly: main advances by one commit
          # while the rebase drops one, and the range then holds an unrelated
          # revision plus the remaining PR commits while the count still
          # matches. Every structural check passes -- single-parent, contiguous,
          # not an ancestor of the stale base -- and another PR's revision is
          # dispatched and recorded under this PR's number.
          #
          # It also separates a legitimate rebase from a squash, which no count
          # rule can: both land fewer revisions than reported. A rebase preserves
          # each commit's CHANGE; a squash combines them into one whose change
          # matches no individual commit. Squash-merging contradicts the
          # rebase-only rule in docs/documentation/git-branch-protection-workflow.md,
          # so it is refused rather than reported -- the fail-closed coverage
          # audit reports the resulting ungated revision, and a dispatcher that
          # quietly accepted the drift would leave nothing to notice it.
          #
          # Identity is the patch-id, not the subject. A rebase rewrites SHAs, so
          # those cannot be compared; subjects can be compared but are not
          # unique, and two commits titled "fix lint" -- one from this PR, one
          # from a merge that landed underneath it -- are indistinguishable by
          # text. patch-id hashes the change itself, is stable across rebase, and
          # differs for a squash and for unrelated work.
          #
          # The PR's own commits are fetched for this. They are not otherwise
          # present: the checkout has main, and a rebase merge rewrote every SHA
          # the API reports.
          if ! git fetch origin "refs/pull/$PR_NUMBER/head" --quiet; then
            echo "::error::Could not fetch refs/pull/$PR_NUMBER/head, so enumerated revisions cannot be attributed to this PR. Refusing to dispatch on an unverifiable window."
            exit 1
          fi
          pr_head="$(git rev-parse FETCH_HEAD)"
          pr_patch_ids="$(git rev-list --reverse "$BASE_SHA..$pr_head" | while read -r pr_commit; do
            git show "$pr_commit" | git patch-id --stable | cut -d' ' -f1
          done)"
          if [ -z "$pr_patch_ids" ]; then
            echo "::error::PR #$PR_NUMBER contributed no identifiable changes from $BASE_SHA, so the enumerated window cannot be attributed to it. Refusing to dispatch."
            exit 1
          fi

          # Each PR change may be claimed once. Consuming matches rather than
          # testing membership means a duplicated change cannot admit an extra
          # revision that happens to look like one the PR already accounted for.
          unclaimed_patch_ids="$pr_patch_ids"
          for candidate in $revisions; do
            candidate_patch_id="$(git show "$candidate" | git patch-id --stable | cut -d' ' -f1)"
            if ! printf '%s\n' "$unclaimed_patch_ids" | grep -Fxq "$candidate_patch_id"; then
              candidate_subject="$(git log -1 --format=%s "$candidate")"
              echo "::error::Revision $candidate (\"$candidate_subject\") makes a change that PR #$PR_NUMBER does not contain. The enumerated window holds work this PR did not add, or the merge was not a rebase. Refusing to dispatch."
              exit 1
            fi
            unclaimed_patch_ids="$(printf '%s\n' "$unclaimed_patch_ids" | awk -v claimed="$candidate_patch_id" '
              BEGIN { removed = 0 }
              { if (!removed && $0 == claimed) { removed = 1; next } print }
            ')"
          done

          # The window must be one contiguous single-parent chain ending at the
          # merge commit, and every commit in it must be NEW to main.
          #
          # Single-parent alone does not catch a squash: a squash of an 8-commit
          # PR lands one commit, COMMIT_COUNT is still 8, and the walk returns
          # that commit plus seven that earlier PRs already put on main. Those
          # seven are single-parent and perfectly contiguous, so the linearity
          # checks pass while the run record claims revisions this PR never
          # added. A commit that predates the PR's base is reachable from
          # base.sha; a rebased commit never is, even when main moved during the
          # PR's life, because the rebase rewrites it onto newer history.
          # A distinct loop variable on purpose: this validation pass and the
          # dispatch loop below are different phases, and sharing `$revision`
          # made them indistinguishable to the ordering checks that keep the
          # ancestry guard inside the dispatch loop.
          previous=""
          for candidate in $revisions; do
            candidate_parents="$(git rev-list --parents -n 1 "$candidate" | wc -w)"
            if [ "$candidate_parents" -ne 2 ]; then
              echo "::error::Revision $candidate has $((candidate_parents - 1)) parent(s); the enumerated window must be linear."
              exit 1
            fi
            if git merge-base --is-ancestor "$candidate" "$BASE_SHA"; then
              echo "::error::Revision $candidate is an ancestor of base $BASE_SHA, so this PR did not add it; the enumeration is claiming revisions from earlier merges (a squash merge produces exactly this). Refusing to dispatch."
              exit 1
            fi
            if [ -n "$previous" ]; then
              actual_parent="$(git rev-parse "${candidate}^")"
              if [ "$actual_parent" != "$previous" ]; then
                echo "::error::Revision $candidate has parent $actual_parent, expected $previous; the enumerated window is not contiguous."
                exit 1
              fi
            fi
            previous="$candidate"
          done

          # Announce the work before the loop. Without this a failure inside
          # the first iteration produces no output at all, which is how three
          # dispatcher 403s across two repositories arrived with nothing to
          # identify the operation that refused.
          echo "Enumerated $(printf '%s\n' $revisions | wc -l) revision(s) for PR #$PR_NUMBER at $MERGE_COMMIT_SHA"

          # Run one gh call, and on failure say which API operation refused and
          # what it returned. A bare "Resource not accessible by integration"
          # names neither, and the operations here need different permissions.
          run_gh() {
            local operation="$1"
            shift
            local output status=0
            # Capture the status with `|| status=$?` rather than testing with
            # `if !`: the `!` inverts the result, so `$?` inside the branch is
            # the negation's 0 and every diagnostic would have read "exit 0".
            # The `||` also keeps `set -e` from aborting before we report.
            output="$("$@" 2>&1)" || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::$operation failed (exit $status): $output"
              return "$status"
            fi
            # Deliberately silent on success. Callers used to append
            # `>/dev/null` to drop the API response, and that redirect applied
            # to the whole function -- including the error line above, so the
            # diagnostic vanished exactly when it fired.
          }

          for revision in $revisions; do
            # A revision that is not on the fetched main (for example after a
            # forced move of main between the merge event and this checkout)
            # must never be tagged or gated as main history.
            if ! git merge-base --is-ancestor "$revision" HEAD; then
              echo "::error::Revision $revision is not an ancestor of main; refusing to dispatch."
              exit 1
            fi
            dispatch_ref="main-releasability-${revision}"
            # Existence is decided by exit code, never by output: `gh api`
            # writes a 404 body to stdout, so testing the text reads
            # '{"message":...}' as a sha.
            existing_ref_sha=""
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$dispatch_ref" \
                --jq .object.sha >"$RUNNER_TEMP/existing_ref" 2>/dev/null; then
              existing_ref_sha="$(cat "$RUNNER_TEMP/existing_ref")"
              if [ "$existing_ref_sha" != "$revision" ]; then
                echo "::error::Dispatch ref $dispatch_ref points to $existing_ref_sha, expected $revision"
                exit 1
              fi
              # A dispatch tag that already exists means this revision was
              # already enumerated by an earlier merge. That is the observable
              # trace of the one case patch identity cannot resolve: when another
              # PR lands the same change and this PR's now-redundant commit is
              # dropped by the rebase, the two revisions are identical by every
              # local measure, so this window can claim one of theirs. Coverage
              # is unaffected -- the revision receives a verdict either way, and
              # already had one -- but the attribution recorded against it is
              # this PR rather than the one that landed it. Saying so leaves a
              # trail rather than a silent mis-attribution, and dispatch still
              # proceeds so a previously failed gate run can be re-driven.
              echo "::notice::Dispatch ref $dispatch_ref already exists, so $revision was gated by an earlier merge. Re-dispatching under PR #$PR_NUMBER; if this PR did not land that revision, the attribution here is the earlier merge's."
              echo "  tag exists for $revision"
            fi
            if [ -z "$existing_ref_sha" ]; then
              run_gh "POST /repos/$GITHUB_REPOSITORY/git/refs (create $dispatch_ref)" \
                gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$dispatch_ref" \
                -f sha="$revision"
              echo "  tag created for $revision"
            fi
            run_gh "POST /repos/$GITHUB_REPOSITORY/actions/workflows/main-releasability.yml/dispatches (ref $dispatch_ref)" \
              gh workflow run main-releasability.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$dispatch_ref" \
              -f expected_sha="$revision" \
              -f triggering_pr="$PR_NUMBER" \
              -f source_branch="main"
            echo "Dispatched main releasability for $revision (PR #$PR_NUMBER)"
          done
