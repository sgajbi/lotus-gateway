name: Platform End-to-End Validation Lane

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e-platform-capabilities-live:
    name: Platform End-to-End Validation / Gateway Live Upstreams
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOTUS_MANAGE_REPO_PATH: ../lotus-manage
      LOTUS_CORE_REPO_PATH: ../lotus-core
      LOTUS_PERFORMANCE_REPO_PATH: ../lotus-performance
      LOTUS_REPORT_REPO_PATH: ../lotus-report
      LOTUS_ARCHIVE_REPO_PATH: ../lotus-archive
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Clone upstream repos
        run: |
          git clone https://github.com/sgajbi/lotus-manage.git ../lotus-manage
          git clone https://github.com/sgajbi/lotus-core.git ../lotus-core
          git clone https://github.com/sgajbi/lotus-performance.git ../lotus-performance
          git clone https://github.com/sgajbi/lotus-report.git ../lotus-report
          git clone https://github.com/sgajbi/lotus-archive.git ../lotus-archive
      - name: Start live E2E stack
        run: make e2e-up
      - name: Validate lotus-gateway aggregation against live upstreams
        run: make test-e2e-live
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color
      - name: Cleanup live E2E stack
        if: always()
        run: make e2e-down
