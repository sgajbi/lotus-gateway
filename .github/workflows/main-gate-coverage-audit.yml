name: Main Gate Coverage Audit

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    name: Audit / Every Main Commit Has A Gate Verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Audit main gate coverage (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          python scripts/audit_main_gate_coverage.py --limit 60 --fail-on-gap
      - name: Compare live branch protection against policy (fail closed)
        env:
          # github.token cannot carry administration:read, which the branch
          # protection endpoint requires. No Lotus repository holds this
          # secret yet, so this step fails closed until one is provisioned.
          GH_TOKEN: ${{ secrets.LOTUS_AUTOMERGE_TOKEN }}
        run: python scripts/check_branch_protection_policy.py
