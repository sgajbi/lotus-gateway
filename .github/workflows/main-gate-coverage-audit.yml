name: Main Gate Coverage Audit

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    name: Audit / Every Main Commit Has A Gate Verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Audit main gate coverage (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          python scripts/audit_main_gate_coverage.py --limit 60 --fail-on-gap

  branch_protection:
    # A separate job, not a second step, so the two have independent statuses.
    # As one job the workflow had been red for days because no repository holds
    # an administration:read token, and a coverage regression landing in an
    # already-red workflow would have changed nothing anyone could see. Which
    # control failed is now readable without opening the log (#774).
    name: Audit / Live Branch Protection Matches Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Compare live branch protection against policy (fail closed)
        env:
          # github.token cannot carry administration:read, which the branch
          # protection endpoint requires. No Lotus repository holds this
          # secret yet, so this job fails closed until one is provisioned --
          # exit 4, reported as "never read" rather than as drift.
          GH_TOKEN: ${{ secrets.LOTUS_AUTOMERGE_TOKEN }}
        run: python scripts/check_branch_protection_policy.py
