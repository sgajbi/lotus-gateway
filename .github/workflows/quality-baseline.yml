name: Quality Baseline

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  # PR number cancels stale revisions across synchronize events. Manual runs use
  # a unique run id and cannot replace the protected PR check.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality-baseline:
    name: Quality Baseline / Ratcheted Trend Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install Duplicate-Code Quality Tooling
        working-directory: quality
        continue-on-error: true
        run: npm ci --ignore-scripts

      - name: Install Python Quality Tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,quality]"
          python -m pip check

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Enforce Refactored Source Thresholds
        run: |
          mkdir -p output/quality-baseline
          python scripts/check_refactor_quality_thresholds.py \
            --max-source-file-lines 315 \
            --max-function-lines 49 \
            2>&1 | tee output/quality-baseline/refactor-thresholds.txt

      - name: Enforce Workflow Governance
        run: |
          mkdir -p output/quality-baseline
          python scripts/check_workflow_action_runtime.py \
            2>&1 | tee output/quality-baseline/workflow-governance.txt

      - name: Enforce Agent Quality Evidence
        run: |
          mkdir -p output/quality-baseline
          python scripts/check_agent_quality_evidence.py \
            2>&1 | tee output/quality-baseline/agent-quality-evidence.txt

      - name: Ruff
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          mkdir -p output/quality-baseline
          python -m ruff check . 2>&1 | tee output/quality-baseline/ruff.txt
          status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${status}" >> output/quality-baseline/ruff.txt
          exit "${status}"

      - name: Mypy
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          python -m mypy src 2>&1 | tee output/quality-baseline/mypy.txt
          status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${status}" >> output/quality-baseline/mypy.txt
          exit "${status}"

      - name: Coverage
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          make test-coverage 2>&1 | tee output/quality-baseline/coverage.txt
          status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${status}" >> output/quality-baseline/coverage.txt
          exit "${status}"

      - name: Architecture Import Rules
        continue-on-error: true
        run: |
          set +e
          lint-imports --config .importlinter 2>&1 | tee output/quality-baseline/import-linter.txt
          status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${status}" >> output/quality-baseline/import-linter.txt
          exit "${status}"

      - name: Complexity Baseline
        continue-on-error: true
        run: |
          set +e
          {
            radon_cc_status=0
            radon cc src/app -s -a || radon_cc_status=$?
            radon_mi_status=0
            radon mi src/app -s || radon_mi_status=$?
            xenon_status=0
            xenon --max-absolute C --max-modules B --max-average A src/app || xenon_status=$?
            status=0
            if [ "${radon_cc_status}" -ne 0 ] || [ "${radon_mi_status}" -ne 0 ] || [ "${xenon_status}" -ne 0 ]; then
              status=1
            fi
            exit "${status}"
          } 2>&1 | tee output/quality-baseline/complexity.txt
          status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${status}" >> output/quality-baseline/complexity.txt
          exit "${status}"

      - name: Duplicate Code Baseline
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          mkdir -p output/quality-baseline/duplicate-code
          quality/node_modules/.bin/jscpd \
            --min-lines 15 \
            --min-tokens 50 \
            --max-lines 10000 \
            --max-size 1mb \
            --format python \
            --reporters json \
            --output output/quality-baseline/duplicate-code \
            --pattern '**/*.py' \
            src/app \
            --noTips 2>&1 | tee output/quality-baseline/duplicate-code.txt
          status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${status}" >> output/quality-baseline/duplicate-code.txt
          first_status=${status}

          mkdir -p output/quality-baseline/duplicate-code/reproducibility
          quality/node_modules/.bin/jscpd \
            --min-lines 15 \
            --min-tokens 50 \
            --max-lines 10000 \
            --max-size 1mb \
            --format python \
            --reporters json \
            --output output/quality-baseline/duplicate-code/reproducibility \
            --pattern '**/*.py' \
            src/app \
            --noTips 2>&1 | tee output/quality-baseline/duplicate-code-reproducibility.txt
          second_status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${second_status}" >> output/quality-baseline/duplicate-code-reproducibility.txt
          if [ "${first_status}" -ne 0 ] || [ "${second_status}" -ne 0 ]; then
            exit 1
          fi

      - name: Enforce Duplicate Code Ratchet
        if: always()
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          python scripts/check_duplicate_code_ratchet.py \
            --report output/quality-baseline/duplicate-code/jscpd-report.json \
            --artifact-log output/quality-baseline/duplicate-code.txt \
            --baseline quality/duplicate_code_baseline.json \
            --source-root . \
            2>&1 | tee output/quality-baseline/duplicate-code-ratchet.txt
          status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${status}" >> output/quality-baseline/duplicate-code-ratchet.txt
          exit "${status}"

      - name: Enforce Duplicate Code Reproducibility
        if: always()
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          python -m scripts.check_duplicate_code_reproducibility \
            --first-report output/quality-baseline/duplicate-code/jscpd-report.json \
            --second-report output/quality-baseline/duplicate-code/reproducibility/jscpd-report.json \
            --first-artifact-log output/quality-baseline/duplicate-code.txt \
            --second-artifact-log output/quality-baseline/duplicate-code-reproducibility.txt \
            --source-root . \
            2>&1 | tee output/quality-baseline/duplicate-code-reproducibility-ratchet.txt
          status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${status}" >> output/quality-baseline/duplicate-code-reproducibility-ratchet.txt
          exit "${status}"

      - name: Dead Code Baseline
        continue-on-error: true
        run: |
          set +e
          vulture src/app tests --min-confidence 80 2>&1 | tee output/quality-baseline/vulture.txt
          status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${status}" >> output/quality-baseline/vulture.txt
          exit "${status}"

      - name: Dependency Baseline
        continue-on-error: true
        run: |
          set +e
          deptry . 2>&1 | tee output/quality-baseline/deptry.txt
          status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${status}" >> output/quality-baseline/deptry.txt
          exit "${status}"

      - name: Security Baseline
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          {
            bandit -q -r src/app -c pyproject.toml
            bandit_status=$?
            make security-audit
            audit_status=$?
            if [ "${bandit_status}" -ne 0 ] || [ "${audit_status}" -ne 0 ]; then
              exit 1
            fi
          } 2>&1 | tee output/quality-baseline/security.txt
          status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${status}" >> output/quality-baseline/security.txt
          exit "${status}"

      - name: Documentation Baseline
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          interrogate src/app 2>&1 | tee output/quality-baseline/interrogate.txt
          status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${status}" >> output/quality-baseline/interrogate.txt
          exit "${status}"

      - name: OpenAPI Spectral Baseline
        continue-on-error: true
        run: |
          python - <<'PY' > openapi.json
          import json
          from app.main import app
          print(json.dumps(app.openapi(), indent=2))
          PY
          set +e
          spectral lint openapi.json --ruleset .spectral.yaml 2>&1 | tee output/quality-baseline/spectral.txt
          status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${status}" >> output/quality-baseline/spectral.txt
          exit "${status}"

      - name: Demo Certification Baseline
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          mkdir -p output/quality-baseline output/demo-certification
          make demo-certification 2>&1 | tee output/quality-baseline/demo-certification.txt
          status=${PIPESTATUS[0]}
          printf 'QUALITY_COMMAND_STATUS=%s\n' "${status}" >> output/quality-baseline/demo-certification.txt
          exit "${status}"

      - name: Evaluate Quality Ratchet
        if: always()
        run: |
          set -o pipefail
          python scripts/check_quality_baseline_ratchet.py \
            2>&1 | tee output/quality-baseline/quality-ratchet.txt

      - name: Validate Quality Baseline Artifact Set
        if: always()
        run: python scripts/check_quality_baseline_artifacts.py

      - name: Upload Quality Baseline Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-baseline
          path: |
            output/quality-baseline/
            output/demo-certification/
            openapi.json
          if-no-files-found: error

      - name: Enforce Duplicate Code Ratchet Result
        if: always()
        run: |
          ratchet_status=missing
          ratchet_marker_count=0
          if [ -f output/quality-baseline/duplicate-code-ratchet.txt ]; then
            ratchet_marker_count=$(grep -c '^QUALITY_COMMAND_STATUS=' output/quality-baseline/duplicate-code-ratchet.txt || true)
            if [ "${ratchet_marker_count}" -eq 1 ]; then
              ratchet_status=$(sed -n 's/^QUALITY_COMMAND_STATUS=//p' output/quality-baseline/duplicate-code-ratchet.txt)
            fi
          fi
          reproducibility_status=missing
          reproducibility_marker_count=0
          if [ -f output/quality-baseline/duplicate-code-reproducibility-ratchet.txt ]; then
            reproducibility_marker_count=$(grep -c '^QUALITY_COMMAND_STATUS=' output/quality-baseline/duplicate-code-reproducibility-ratchet.txt || true)
            if [ "${reproducibility_marker_count}" -eq 1 ]; then
              reproducibility_status=$(sed -n 's/^QUALITY_COMMAND_STATUS=//p' output/quality-baseline/duplicate-code-reproducibility-ratchet.txt)
            fi
          fi
          if [ "${ratchet_marker_count}" -ne 1 ] || [ "${ratchet_status}" != "0" ] || \
             [ "${reproducibility_marker_count}" -ne 1 ] || [ "${reproducibility_status}" != "0" ]; then
            echo "Duplicate-code quality gate failed after evidence collection (ratchet_status=${ratchet_status}; ratchet_markers=${ratchet_marker_count}; reproducibility_status=${reproducibility_status}; reproducibility_markers=${reproducibility_marker_count})."
            exit 1
          fi
