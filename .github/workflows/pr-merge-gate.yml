name: Pull Request Merge Gate

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LOTUS_ADVISE_PROPOSAL_DECISION_VOCABULARY_URL: https://api.github.com/repos/sgajbi/lotus-advise/contents/docs/standards/proposal-decision-vocabulary.v1.json?ref=main
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lotus-gateway
  IMAGE_TAG: ${{ github.sha }}

jobs:
  image-acquisition:
    name: Image Acquisition / Exact Distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.base.outputs.image }}
      trivy: ${{ steps.trivy.outputs.image }}
      syft: ${{ steps.syft.outputs.image }}
    steps:
      - name: Require immutable qualified governance source
        shell: bash
        env:
          GOVERNANCE_SHA: ${{ vars.LOTUS_PLATFORM_GOVERNANCE_SHA }}
        run: '[[ "$GOVERNANCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-platform
          ref: ${{ vars.LOTUS_PLATFORM_GOVERNANCE_SHA }}
          persist-credentials: false
          path: .lotus-platform
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify admitted base distribution
        id: base
        shell: bash
        env:
          SOURCE_IMAGE: docker.io/library/python@sha256:e529028263dbe6910a2d96f7d2b8f5266385e917fd45d286ef166977c094a51e
          DISTRIBUTION_IMAGE: public.ecr.aws/docker/library/python@sha256:e529028263dbe6910a2d96f7d2b8f5266385e917fd45d286ef166977c094a51e
        run: >-
          python .lotus-platform/automation/validate_technology_governance_policy.py
          --source-image "$SOURCE_IMAGE"
          --distribution-image "$DISTRIBUTION_IMAGE"
          --platform linux/amd64
          --verify-distribution
          --github-output "$GITHUB_OUTPUT"
          --acquisition-evidence "$RUNNER_TEMP/image-acquisition-evidence/base"
      - name: Verify admitted trivy distribution
        id: trivy
        shell: bash
        env:
          SOURCE_IMAGE: docker.io/aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          DISTRIBUTION_IMAGE: ghcr.io/aquasecurity/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
        run: >-
          python .lotus-platform/automation/validate_technology_governance_policy.py
          --source-image "$SOURCE_IMAGE"
          --distribution-image "$DISTRIBUTION_IMAGE"
          --platform linux/amd64
          --verify-distribution
          --github-output "$GITHUB_OUTPUT"
          --acquisition-evidence "$RUNNER_TEMP/image-acquisition-evidence/trivy"
      - name: Verify admitted syft distribution
        id: syft
        shell: bash
        env:
          SOURCE_IMAGE: docker.io/anchore/syft@sha256:5999d209a342e55e9edf70bf8930fb5b86d8f2a783fa401178372c50e21b1d36
          DISTRIBUTION_IMAGE: ghcr.io/anchore/syft@sha256:5999d209a342e55e9edf70bf8930fb5b86d8f2a783fa401178372c50e21b1d36
        run: >-
          python .lotus-platform/automation/validate_technology_governance_policy.py
          --source-image "$SOURCE_IMAGE"
          --distribution-image "$DISTRIBUTION_IMAGE"
          --platform linux/amd64
          --verify-distribution
          --github-output "$GITHUB_OUTPUT"
          --acquisition-evidence "$RUNNER_TEMP/image-acquisition-evidence/syft"
      - name: Preserve failed public manifest responses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-acquisition-failures-${{ github.workflow }}
          path: ${{ runner.temp }}/image-acquisition-evidence
          if-no-files-found: ignore
          retention-days: 14

  issue-lifecycle:
    name: ${{ github.event_name == 'pull_request' && 'PR Merge Gate / Issue Lifecycle Text' || 'PR Merge Gate / Issue Lifecycle Text (manual metadata unavailable)' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Enforce PR issue lifecycle wording
        env:
          LOTUS_PR_TITLE: ${{ github.event.pull_request.title }}
          LOTUS_PR_BODY: ${{ github.event.pull_request.body }}
        run: make pr-issue-lifecycle

  workflow-lint:
    name: PR Merge Gate / Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  lint-typecheck-unit:
    name: PR Merge Gate / Lint Typecheck Unit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify Dependencies
        run: python -m pip check
      - name: Security Audit
        run: make security-audit
      - name: Lint and Refactor Quality Thresholds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: Migration Contract Smoke
        run: make migration-smoke
      - name: Unit + Contract Tests
        run: make test-unit

  integration:
    name: PR Merge Gate / Integration Tests
    needs: [lint-typecheck-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration Tests
        run: make test-integration

  coverage:
    name: PR Merge Gate / Coverage Gate
    needs: [lint-typecheck-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Coverage
        run: make test-coverage

  docker-build:
    env:
      GATEWAY_BASE_IMAGE: ${{ needs.image-acquisition.outputs.base }}
      SYFT_IMAGE: ${{ needs.image-acquisition.outputs.syft }}
      TRIVY_IMAGE: ${{ needs.image-acquisition.outputs.trivy }}
    name: PR Merge Gate / Validate Docker Build
    needs: [integration, coverage, image-acquisition]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: |
          mkdir -p output/container-security
          BUILD_TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "LOTUS_BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> "$GITHUB_ENV"
          docker pull --platform linux/amd64 "${GATEWAY_BASE_IMAGE}"
          docker image inspect "${GATEWAY_BASE_IMAGE}" > output/container-security/base-acquired.json
          docker build --platform linux/amd64 \
            --build-arg GATEWAY_BASE_IMAGE="${GATEWAY_BASE_IMAGE}" \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            -t lotus-gateway:ci-test \
            --build-arg LOTUS_APP_VERSION=0.1.0 \
            --build-arg LOTUS_GIT_COMMIT_SHA="${GITHUB_SHA}" \
            --build-arg LOTUS_GIT_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            --build-arg LOTUS_BUILD_TIMESTAMP="${BUILD_TIMESTAMP}" \
            --build-arg LOTUS_REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg LOTUS_CI_RUN_ID="${GITHUB_RUN_ID}" \
            .
          IMAGE_DIGEST="$(docker image inspect --format='{{.Id}}' "${IMAGE_NAME}:${IMAGE_TAG}")"
          echo "LOTUS_IMAGE_DIGEST=${IMAGE_DIGEST}" >> "$GITHUB_ENV"
      - name: Generate SBOM
        run: |
          docker pull --platform linux/amd64 "${SYFT_IMAGE}"
          docker image inspect "${SYFT_IMAGE}" > output/container-security/syft-acquired.json
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/output/container-security:/output" \
            "${SYFT_IMAGE}" "${IMAGE_NAME}:${IMAGE_TAG}" \
            -o spdx-json=/output/sbom.spdx.json
      - name: Vulnerability Scan
        run: |
          docker pull --platform linux/amd64 "${TRIVY_IMAGE}"
          docker image inspect "${TRIVY_IMAGE}" > output/container-security/trivy-acquired.json
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/output/container-security:/output" \
            "${TRIVY_IMAGE}" image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format json \
            --output /output/trivy-image-scan.json \
            "${IMAGE_NAME}:${IMAGE_TAG}"
      - name: Record PR Signing Posture
        run: |
          echo "PR images are not pushed or signed; main releasability signs the promoted digest." \
            > output/container-security/cosign-signature.txt
          echo "PR images are not pushed or attested; main releasability attests the promoted digest." \
            > output/container-security/provenance-attestation.txt
      - name: Write Container Release Manifest
        run: |
          python scripts/write_container_release_manifest.py \
            --image-name "${IMAGE_NAME}" \
            --image-tag "${IMAGE_TAG}" \
            --image-digest "${LOTUS_IMAGE_DIGEST}" \
            --git-commit-sha "${GITHUB_SHA}" \
            --git-branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            --build-timestamp "${LOTUS_BUILD_TIMESTAMP}" \
            --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --ci-run-id "${GITHUB_RUN_ID}"
      - name: Validate Container Release Evidence
        run: python scripts/check_container_release_evidence.py --allow-unsigned
      - name: Upload Container Release Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-container-release-evidence
          path: output/container-security/
          if-no-files-found: error

  ci-local-docker:
    env:
      GATEWAY_BASE_IMAGE: ${{ needs.image-acquisition.outputs.base }}
    name: PR Merge Gate / CI Local Docker Parity
    needs: [integration, coverage, image-acquisition]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Dockerized local CI parity
        run: |
          mkdir -p output/image-acquisition-parity
          docker pull --platform linux/amd64 "${GATEWAY_BASE_IMAGE}"
          docker image inspect "${GATEWAY_BASE_IMAGE}" > output/image-acquisition-parity/base-acquired.json
          make ci-local-docker
      - name: Cleanup
        if: always()
        run: make ci-local-docker-down
      - name: Preserve parity base acquisition evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-acquisition-parity-${{ github.workflow }}
          path: output/image-acquisition-parity/
          if-no-files-found: error
