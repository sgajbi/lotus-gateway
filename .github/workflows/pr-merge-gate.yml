name: Pull Request Merge Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lotus-gateway
  IMAGE_TAG: ${{ github.sha }}
  SYFT_IMAGE: anchore/syft:v1.42.3
  TRIVY_IMAGE: aquasec/trivy:0.72.0

jobs:
  workflow-lint:
    name: PR Merge Gate / Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  lint-typecheck-unit:
    name: PR Merge Gate / Lint Typecheck Unit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify Dependencies
        run: python -m pip check
      - name: Security Audit
        run: make security-audit
      - name: Lint and Refactor Quality Thresholds
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: Migration Contract Smoke
        run: make migration-smoke
      - name: Unit + Contract Tests
        run: make test-unit

  integration:
    name: PR Merge Gate / Integration Tests
    needs: [lint-typecheck-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration Tests
        run: make test-integration

  coverage:
    name: PR Merge Gate / Coverage Gate
    needs: [lint-typecheck-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Coverage
        run: make test-coverage

  docker-build:
    name: PR Merge Gate / Validate Docker Build
    needs: [integration, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: |
          mkdir -p output/container-security
          BUILD_TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "LOTUS_BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> "$GITHUB_ENV"
          docker build \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            -t lotus-gateway:ci-test \
            --build-arg LOTUS_APP_VERSION=0.1.0 \
            --build-arg LOTUS_GIT_COMMIT_SHA="${GITHUB_SHA}" \
            --build-arg LOTUS_GIT_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            --build-arg LOTUS_BUILD_TIMESTAMP="${BUILD_TIMESTAMP}" \
            --build-arg LOTUS_REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg LOTUS_CI_RUN_ID="${GITHUB_RUN_ID}" \
            .
          IMAGE_DIGEST="$(docker image inspect --format='{{.Id}}' "${IMAGE_NAME}:${IMAGE_TAG}")"
          echo "LOTUS_IMAGE_DIGEST=${IMAGE_DIGEST}" >> "$GITHUB_ENV"
      - name: Generate SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/output/container-security:/output" \
            "${SYFT_IMAGE}" "${IMAGE_NAME}:${IMAGE_TAG}" \
            -o spdx-json=/output/sbom.spdx.json
      - name: Vulnerability Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/output/container-security:/output" \
            "${TRIVY_IMAGE}" image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format json \
            --output /output/trivy-image-scan.json \
            "${IMAGE_NAME}:${IMAGE_TAG}"
      - name: Record PR Signing Posture
        run: |
          echo "PR images are not pushed or signed; main releasability signs the promoted digest." \
            > output/container-security/cosign-signature.txt
          echo "PR images are not pushed or attested; main releasability attests the promoted digest." \
            > output/container-security/provenance-attestation.txt
      - name: Write Container Release Manifest
        run: |
          python scripts/write_container_release_manifest.py \
            --image-name "${IMAGE_NAME}" \
            --image-tag "${IMAGE_TAG}" \
            --image-digest "${LOTUS_IMAGE_DIGEST}" \
            --git-commit-sha "${GITHUB_SHA}" \
            --git-branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            --build-timestamp "${LOTUS_BUILD_TIMESTAMP}" \
            --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --ci-run-id "${GITHUB_RUN_ID}"
      - name: Validate Container Release Evidence
        run: python scripts/check_container_release_evidence.py --allow-unsigned
      - name: Upload Container Release Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-container-release-evidence
          path: output/container-security/
          if-no-files-found: error

  ci-local-docker:
    name: PR Merge Gate / CI Local Docker Parity
    needs: [integration, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Dockerized local CI parity
        run: make ci-local-docker
      - name: Cleanup
        if: always()
        run: make ci-local-docker-down
