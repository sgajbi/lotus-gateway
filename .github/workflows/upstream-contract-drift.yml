name: Upstream Contract Drift

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [lotus-advise-proposal-decision-vocabulary]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LOTUS_ADVISE_PROPOSAL_DECISION_VOCABULARY_URL: https://api.github.com/repos/sgajbi/lotus-advise/contents/docs/standards/proposal-decision-vocabulary.v1.json?ref=main

jobs:
  proposal-decision-vocabulary:
    name: Upstream Contract Drift / Advise Proposal Decision Vocabulary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Gateway runtime package
        run: python -m pip install .
      - name: Reconcile source-owned proposal decision vocabulary
        run: make proposal-decision-vocabulary-gate
