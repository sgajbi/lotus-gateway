name: Main Releasability Gate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional merged pull-request SHA that this run must validate."
        required: false
        type: string
      triggering_pr:
        description: "Optional pull request number that dispatched this mainline validation."
        required: false
        type: string
      source_branch:
        description: "Source branch name to stamp into release metadata when dispatch uses an immutable tag."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lotus-gateway
  IMAGE_TAG: ${{ github.sha }}
  LOTUS_RELEASE_SOURCE_BRANCH: ${{ inputs.source_branch || github.ref_name }}
  SYFT_IMAGE: anchore/syft:v1.42.3
  TRIVY_IMAGE: aquasec/trivy:0.72.0

jobs:
  exact-revision-assertion:
    name: Main Releasability / Exact Revision Assertion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Assert expected merged PR SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TRIGGERING_PR: ${{ inputs.triggering_pr }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ -z "$EXPECTED_SHA" ]; then
            echo "No expected_sha input supplied; treating this as an operator-dispatched main releasability run."
            exit 0
          fi
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Main releasability checkout SHA $actual_sha does not match expected merged PR SHA $EXPECTED_SHA for PR ${TRIGGERING_PR:-unknown}."
            exit 1
          fi
          echo "Validated exact merged PR SHA $EXPECTED_SHA for PR ${TRIGGERING_PR:-unknown}."

  workflow-lint:
    name: Main Releasability / Workflow Lint
    needs: [exact-revision-assertion]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  lint-typecheck-unit:
    name: Main Releasability / Lint Typecheck Unit
    needs: [exact-revision-assertion]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify Dependencies
        run: python -m pip check
      - name: Security Audit
        run: make security-audit
      - name: Lint and Refactor Quality Thresholds
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: Migration Contract Smoke
        run: make migration-smoke
      - name: Unit + Contract Tests
        run: make test-unit

  integration:
    name: Main Releasability / Integration Tests
    needs: [lint-typecheck-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration Tests
        run: make test-integration

  coverage:
    name: Main Releasability / Coverage Gate
    needs: [lint-typecheck-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Coverage
        run: |
          mkdir -p output/main-releasability
          make test-coverage 2>&1 | tee output/main-releasability/coverage.txt
      - name: Generate Main Release Evidence
        run: |
          mkdir -p output/main-releasability output/demo-certification
          python scripts/check_workflow_action_runtime.py \
            2>&1 | tee output/main-releasability/workflow-governance.txt
          python scripts/check_agent_quality_evidence.py \
            2>&1 | tee output/main-releasability/agent-quality-evidence.txt
          make security-audit 2>&1 | tee output/main-releasability/security.txt
          python - <<'PY' > openapi.json
          import json
          from app.main import app
          print(json.dumps(app.openapi(), indent=2))
          PY
          make demo-certification 2>&1 | tee output/main-releasability/demo-certification.txt
      - name: Validate Main Release Evidence
        run: python scripts/check_main_release_evidence.py
      - name: Upload Main Release Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-release-evidence
          path: |
            .coverage
            openapi.json
            output/main-releasability/
            output/demo-certification/
          include-hidden-files: true
          if-no-files-found: error

  docker-build:
    name: Main Releasability / Validate Docker Build
    needs: [integration, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: sigstore/cosign-installer@v4.1.0
      - name: Build image
        run: |
          mkdir -p output/container-security
          BUILD_TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "LOTUS_BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> "$GITHUB_ENV"
          docker build \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            -t lotus-gateway:ci-test \
            --build-arg LOTUS_APP_VERSION=0.1.0 \
            --build-arg LOTUS_GIT_COMMIT_SHA="${GITHUB_SHA}" \
            --build-arg LOTUS_GIT_BRANCH="${LOTUS_RELEASE_SOURCE_BRANCH}" \
            --build-arg LOTUS_BUILD_TIMESTAMP="${BUILD_TIMESTAMP}" \
            --build-arg LOTUS_REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --build-arg LOTUS_CI_RUN_ID="${GITHUB_RUN_ID}" \
            .
      - name: Generate SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/output/container-security:/output" \
            "${SYFT_IMAGE}" "${IMAGE_NAME}:${IMAGE_TAG}" \
            -o spdx-json=/output/sbom.spdx.json
      - name: Vulnerability Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/output/container-security:/output" \
            "${TRIVY_IMAGE}" image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format json \
            --output /output/trivy-image-scan.json \
            "${IMAGE_NAME}:${IMAGE_TAG}"
      - name: Push image from CI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          IMAGE_DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "LOTUS_IMAGE_DIGEST=${IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "LOTUS_IMAGE_REF=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_ENV"
      - name: Sign image
        run: |
          set -o pipefail
          cosign sign --yes "${LOTUS_IMAGE_REF}" \
            2>&1 | tee output/container-security/cosign-signature.txt
      - name: Attest provenance
        run: |
          set -o pipefail
          IMAGE_DIGEST_SHA="${LOTUS_IMAGE_DIGEST#sha256:}"
          cat > output/container-security/provenance-predicate.json <<EOF
          {
            "builder": {
              "id": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            },
            "buildType": "https://github.com/sgajbi/lotus-gateway/.github/workflows/main-releasability.yml",
            "invocation": {
              "configSource": {
                "uri": "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}",
                "digest": {
                  "sha1": "${GITHUB_SHA}"
                },
                "entryPoint": ".github/workflows/main-releasability.yml"
              },
              "parameters": {
                "service": "lotus-gateway",
                "git_branch": "${LOTUS_RELEASE_SOURCE_BRANCH}",
                "ci_run_id": "${GITHUB_RUN_ID}",
                "image_digest": "${LOTUS_IMAGE_DIGEST}",
                "sbom": "output/container-security/sbom.spdx.json"
              }
            },
            "metadata": {
              "buildInvocationID": "${GITHUB_RUN_ID}",
              "buildStartedOn": "${LOTUS_BUILD_TIMESTAMP}",
              "completeness": {
                "parameters": true,
                "environment": true,
                "materials": true
              },
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}",
                "digest": {
                  "sha1": "${GITHUB_SHA}"
                }
              },
              {
                "uri": "${IMAGE_NAME}",
                "digest": {
                  "sha256": "${IMAGE_DIGEST_SHA}"
                }
              }
            ]
          }
          EOF
          cosign attest --yes \
            --predicate output/container-security/provenance-predicate.json \
            --type slsaprovenance \
            "${LOTUS_IMAGE_REF}" \
            2>&1 | tee output/container-security/provenance-attestation.txt
      - name: Write Container Release Manifest
        run: |
          python scripts/write_container_release_manifest.py \
            --image-name "${IMAGE_NAME}" \
            --image-tag "${IMAGE_TAG}" \
            --image-digest "${LOTUS_IMAGE_DIGEST}" \
            --git-commit-sha "${GITHUB_SHA}" \
            --git-branch "${LOTUS_RELEASE_SOURCE_BRANCH}" \
            --build-timestamp "${LOTUS_BUILD_TIMESTAMP}" \
            --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --ci-run-id "${GITHUB_RUN_ID}"
      - name: Validate Container Release Evidence
        run: python scripts/check_container_release_evidence.py
      - name: Upload Container Release Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-container-release-evidence
          path: output/container-security/
          if-no-files-found: error

  ci-local-docker:
    name: Main Releasability / CI Local Docker Parity
    needs: [integration, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Dockerized local CI parity
        run: make ci-local-docker
      - name: Cleanup
        if: always()
        run: make ci-local-docker-down
