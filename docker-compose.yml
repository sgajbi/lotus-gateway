services:
  lotus-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: lotus-gateway:latest
    ports:
      - "8100:8100"
    environment:
      - DECISIONING_SERVICE_BASE_URL=${DECISIONING_SERVICE_BASE_URL:-http://host.docker.internal:8000}
      - MANAGEMENT_SERVICE_BASE_URL=${MANAGEMENT_SERVICE_BASE_URL:-http://host.docker.internal:8001}
      - MANAGE_SPLIT_ENABLED=${MANAGE_SPLIT_ENABLED:-true}
      - PORTFOLIO_DATA_PLATFORM_BASE_URL=${PORTFOLIO_DATA_PLATFORM_BASE_URL:-http://host.docker.internal:8201}
      - PORTFOLIO_DATA_CONTROL_PLANE_BASE_URL=${PORTFOLIO_DATA_CONTROL_PLANE_BASE_URL:-http://host.docker.internal:8202}
      - PORTFOLIO_DATA_INGESTION_BASE_URL=${PORTFOLIO_DATA_INGESTION_BASE_URL:-http://host.docker.internal:8200}
      - PERFORMANCE_ANALYTICS_BASE_URL=${PERFORMANCE_ANALYTICS_BASE_URL:-http://host.docker.internal:8002}
      - AI_SERVICE_BASE_URL=${AI_SERVICE_BASE_URL:-http://host.docker.internal:8140}
      - RISK_ANALYTICS_BASE_URL=${RISK_ANALYTICS_BASE_URL:-http://host.docker.internal:8130}
      - REPORTING_AGGREGATION_BASE_URL=${REPORTING_AGGREGATION_BASE_URL:-http://host.docker.internal:8300}
      - RENDER_SERVICE_BASE_URL=${RENDER_SERVICE_BASE_URL:-http://host.docker.internal:8310}
      - ARCHIVE_SERVICE_BASE_URL=${ARCHIVE_SERVICE_BASE_URL:-http://host.docker.internal:8150}
      - DOMAIN_PRODUCT_CATALOG_PATH=${DOMAIN_PRODUCT_CATALOG_PATH:-/lotus-platform/generated/domain-product-catalog.json}
      - DOMAIN_PRODUCT_DEPENDENCY_GRAPH_PATH=${DOMAIN_PRODUCT_DEPENDENCY_GRAPH_PATH:-/lotus-platform/generated/domain-product-dependency-graph.json}
      - DOMAIN_PRODUCT_LIVE_TRUST_CERTIFICATION_PATH=${DOMAIN_PRODUCT_LIVE_TRUST_CERTIFICATION_PATH:-/lotus-platform/output/trust-certification/domain-product-live-trust-certification.json}
      - UPSTREAM_TIMEOUT_SECONDS=${UPSTREAM_TIMEOUT_SECONDS:-30}
      - CONTRACT_VERSION=${CONTRACT_VERSION:-v1}
    volumes:
      - ../lotus-platform/generated:/lotus-platform/generated:ro
      - ../lotus-platform/output/trust-certification:/lotus-platform/output/trust-certification:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
